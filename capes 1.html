<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cape Clash</title>
<link data-cc rel="preconnect" href="https://fonts.googleapis.com">
<link data-cc rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&family=Chivo+Mono:wght@500;700&family=Caveat:wght@700&display=swap">
<style data-cc>
:root{--bg:#0c0d16;--panel:#151827;--panel2:#1e2338;--line:#2d3452;--fg:#f1f2f8;--dim:#9aa2c0;--acc:#e8243a;--gold:#ffc83d;--win:#4fc97a;--loss:#ea6a5f;
 --display:'Bangers',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif;--cond:'Barlow Condensed','Arial Narrow',sans-serif;--mono:'Chivo Mono',ui-monospace,monospace;--sig:'Caveat','Segoe Script',cursive;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;
 background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.5px),radial-gradient(circle at 12% 0%,#3a0f1f 0,transparent 42%),radial-gradient(circle at 92% 6%,#0f2a52 0,transparent 40%);background-size:14px 14px,100% 100%,100% 100%;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(12,13,22,.94);backdrop-filter:blur(8px);border-bottom:3px solid var(--acc)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:32px;letter-spacing:1.5px;line-height:.9;color:#fff;text-shadow:3px 3px 0 var(--acc),5px 5px 0 #000;transform:rotate(-2deg)}
.logo small{display:block;font-size:14px;letter-spacing:4px;color:var(--gold);text-shadow:2px 2px 0 #000}
.meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.led{background:#06070c;border:1px solid var(--line);border-radius:8px;padding:3px 10px;text-align:center;min-width:78px}
.led b{display:block;font-family:var(--mono);font-size:17px;color:var(--gold)}
.led small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:7px 12px 9px;font-family:var(--display);font-size:19px;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
nav button[aria-selected="true"]{color:#fff;border-color:var(--gold)}
nav button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:4px;vertical-align:2px;box-shadow:0 0 6px var(--acc)}
main{padding-block:22px 80px}
h2{font-family:var(--display);font-weight:400;font-size:42px;letter-spacing:1px;line-height:1;text-shadow:3px 3px 0 #000}
h3{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:1px;text-shadow:2px 2px 0 #000}
.sub{color:var(--dim);margin:4px 0 16px;max-width:66ch}
.btn{background:var(--gold);color:#1b1006;border:2px solid #000;box-shadow:0 3px 0 #000;border-radius:9px;padding:8px 16px;font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn:disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--panel2);color:var(--fg)}
.btn.red{background:var(--acc);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:900;background:var(--gold);color:#111;border:2px solid #000;padding:10px 16px;border-radius:10px;font-weight:700;box-shadow:4px 4px 0 #000;max-width:calc(100% - 32px)}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 14px var(--cond);letter-spacing:.04em;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.cw{position:relative;display:flex;flex-direction:column;gap:5px}
.cw .val{font-family:var(--mono);font-size:11px;color:var(--gold);text-align:center}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.newtag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:9;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;color:#06210f;background:var(--win);border-radius:4px;padding:1px 6px;box-shadow:0 0 10px #4fc97a88;white-space:nowrap}

/* ================= CARD ================= */
.mc{--fr:#8a93a6;--fr2:#3d4352;container-type:inline-size;position:relative;width:100%;aspect-ratio:5/7;border-radius:4.5%/3.2%;padding:3.4%;user-select:none;
 background:linear-gradient(145deg,color-mix(in srgb,var(--fr) 70%,#fff) 0%,var(--fr) 30%,var(--fr2) 65%,var(--fr) 85%,color-mix(in srgb,var(--fr) 60%,#fff) 100%);
 box-shadow:0 0 0 1px #000,0 6px 14px #0009;color:#fff;display:block;border:0;text-align:left}
button.mc{cursor:pointer;transition:transform .15s}
button.mc:hover{transform:translateY(-4px) rotate(-1deg)}
.mc.t-U{--fr:#3fae5a;--fr2:#14532d}.mc.t-R{--fr:#3b82f6;--fr2:#1e3a8a}.mc.t-E{--fr:#a855f7;--fr2:#4c1d95}.mc.t-L{--fr:#f59e0b;--fr2:#7c2d12}
.mc-in{position:relative;height:100%;border-radius:3cqw;overflow:hidden;background:#0a0b12;display:flex;flex-direction:column;box-shadow:inset 0 0 0 .6cqw #000a}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:2cqw;padding:2cqw 3.4cqw;background:linear-gradient(90deg,var(--c1),color-mix(in srgb,var(--c1) 50%,#000));font-family:var(--cond);font-weight:700;font-size:5.6cqw;letter-spacing:.06em;text-transform:uppercase;line-height:1;border-bottom:.6cqw solid var(--c2)}
.mc-top span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-top .st{color:var(--gold);letter-spacing:0;flex:none;text-shadow:0 0 4px #000}
.mc-art{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;
 background:radial-gradient(circle at 50% 48%,color-mix(in srgb,var(--c1) 70%,#fff) 0,var(--c1) 40%,color-mix(in srgb,var(--c1) 35%,#000) 100%)}
.mc-art::before{content:"";position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff14 0 7deg,transparent 7deg 14deg)}
.mc-art::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#0000003a 1.1cqw,transparent 1.4cqw);background-size:4.4cqw 4.4cqw;mix-blend-mode:multiply}
.mc-head{position:relative;z-index:2;width:60cqw;aspect-ratio:1;border-radius:50%;overflow:hidden;border:1.6cqw solid #fff;box-shadow:0 0 0 .8cqw #000,0 2.4cqw 3cqw #000a;display:grid;place-items:center;
 background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c2) 40%,#fff),var(--c2) 55%,color-mix(in srgb,var(--c2) 40%,#000))}
.mc-head b{font-family:var(--display);font-size:20cqw;letter-spacing:.04em;color:#fff;text-shadow:1cqw 1cqw 0 #000a}
.mc-head img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc-name{position:relative;z-index:3;margin-top:-5cqw;padding:3cqw 3cqw 1.6cqw;text-align:center;font-family:var(--display);font-size:10.5cqw;letter-spacing:.03em;line-height:.95;text-shadow:.6cqw .6cqw 0 #000;
 background:linear-gradient(180deg,transparent,#0a0b12 40%)}
.mc-move{text-align:center;font-family:var(--cond);font-weight:700;font-size:5.6cqw;letter-spacing:.04em;color:var(--gold);padding:0 3cqw 1.6cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-foot{display:flex;justify-content:space-between;align-items:center;padding:1.8cqw 3.4cqw;background:#000;font-family:var(--mono);font-size:4.4cqw;font-weight:700;color:#cbd0e2}
.mc-foot b{color:#fff}
.mc-foot .tl{color:var(--fr);letter-spacing:.08em}
.mc-par{position:absolute;left:3.4cqw;top:11cqw;z-index:6;font-family:var(--mono);font-size:3.4cqw;font-weight:700;letter-spacing:.1em;padding:.6cqw 1.8cqw;border-radius:1cqw;background:#000c;border:1px solid var(--fr);color:#fff}
.mc-ser{position:absolute;right:3.4cqw;top:11cqw;z-index:6;font-family:var(--mono);font-size:4cqw;font-weight:700;padding:.6cqw 1.8cqw;border-radius:1cqw;background:linear-gradient(180deg,#fff3c2,#c9a24a);color:#1a1204;box-shadow:0 .6cqw 1.2cqw #000a}
.mc-auto{position:absolute;left:8%;right:8%;bottom:30%;z-index:7;transform:rotate(-4deg);padding:1cqw 3cqw 1.4cqw;border-radius:1.4cqw;background:linear-gradient(180deg,#fff,#e9eef3);box-shadow:0 1cqw 2.4cqw #000b,inset 0 0 0 .4cqw #c9d1db;text-align:center}
.mc-auto .sg{display:block;font-family:var(--sig);font-size:11cqw;line-height:1;color:#1d3f9e;white-space:nowrap;overflow:hidden;text-overflow:clip}
.mc-auto em{display:block;font-style:normal;font-family:var(--mono);font-size:2.6cqw;letter-spacing:.16em;color:#56607a;border-top:.3cqw solid #56607a66;margin-top:.4cqw;padding-top:.4cqw}
.mc-relic{position:absolute;left:4cqw;bottom:34%;z-index:7;width:26cqw;display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mc-relic i{display:block;width:100%;aspect-ratio:1;border-radius:2cqw;box-shadow:0 0 0 .8cqw #d8b25a,0 0 0 1.4cqw #6b4e16,0 1.4cqw 2cqw #000c;
 background:repeating-linear-gradient(45deg,#ffffff1a 0 .5px,transparent .5px 2px),repeating-linear-gradient(-45deg,#0000002a 0 .5px,transparent .5px 2px),radial-gradient(circle,#00000055 .9px,transparent 1.2px) 0 0/3.4px 3.4px,linear-gradient(110deg,var(--c1) 0 55%,var(--c2) 55% 70%,var(--c1) 70%)}
.mc-relic span{font-family:var(--mono);font-size:2.6cqw;font-weight:700;letter-spacing:.06em;padding:.2cqw 1.2cqw;border-radius:.8cqw;background:linear-gradient(90deg,#c9a24a,#fff3c2,#c9a24a);color:#1a0d04;white-space:nowrap}
.mc.has-auto .mc-relic{bottom:auto;top:20%}
/* parallels */
.mc.p-silver{--fr:#dfe6ee;--fr2:#6b7686;background-size:220% 220%;animation:refr 5s linear infinite}
.mc.p-silver,.mc.p-gold,.mc.p-cosmic,.mc.p-super{background-image:linear-gradient(145deg,#fff 0%,var(--fr) 20%,#9fd3ff 38%,var(--fr) 52%,#ffc2ec 70%,var(--fr2) 85%,#fff 100%)}
.mc.p-gold{--fr:#ffcf4a;--fr2:#8a5e0c;background-image:linear-gradient(145deg,#fff6c8,#ffcf4a 25%,#8a5e0c 50%,#ffe08a 70%,#b8860b 85%,#fff3c2);background-size:220% 220%;animation:refr 4s linear infinite;box-shadow:0 0 0 1px #000,0 0 18px #ffcf4a88}
.mc.p-cosmic{--fr:#c084fc;--fr2:#1e1b4b;background-image:radial-gradient(circle,#fff 0 .5cqw,transparent .8cqw),radial-gradient(circle,#c4b5fd 0 .4cqw,transparent .7cqw),linear-gradient(145deg,#4c1d95,#1e1b4b 40%,#7c3aed 60%,#0b0b2a);background-size:13cqw 15cqw,19cqw 11cqw,100% 100%;animation:cosmo 6s linear infinite;box-shadow:0 0 0 1px #000,0 0 22px #a855f7aa}
.mc.p-super{--fr:#ffe08a;--fr2:#b8860b;background:conic-gradient(from var(--sfa,0deg),#fff6c8,#e8b83c,#fff,#b8860b,#ffe08a,#fff3c2,#c99a1e,#fff6c8);animation:sfspin 3s linear infinite;box-shadow:0 0 0 1px #fff3c2,0 0 26px #ffd45acc,0 0 50px #e8b83c66}
@property --sfa{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes sfspin{to{--sfa:360deg}}
@keyframes refr{from{background-position:0% 0%}to{background-position:220% 220%}}
@keyframes cosmo{to{background-position:13cqw 30cqw,-19cqw 22cqw,0 0}}
.mc.p-silver .mc-in::after,.mc.p-gold .mc-in::after,.mc.p-cosmic .mc-in::after,.mc.p-super .mc-in::after,.mc.t-L .mc-in::after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#ffffff40 45%,transparent 60%);background-size:260% 100%;animation:shine 3.4s linear infinite;mix-blend-mode:overlay}
.mc.p-cosmic .mc-art{background:radial-gradient(circle,#fff 0 .5cqw,transparent .8cqw) 0 0/9cqw 11cqw,radial-gradient(circle at 50% 48%,#7c3aed,#1e1b4b 70%)}
@keyframes shine{from{background-position:160% 0}to{background-position:-100% 0}}
.mc.back{background:repeating-linear-gradient(45deg,#7a0d1a 0 4cqw,#a3122a 4cqw 8cqw);display:grid;place-items:center}
.mc.back::after{content:"CAPE\A CLASH";white-space:pre;text-align:center;font-family:var(--display);font-size:17cqw;line-height:.9;color:#fff;text-shadow:1.4cqw 1.4cqw 0 #000}
.mc.back::before{content:"";position:absolute;inset:4cqw;border:1cqw solid #ffffffaa;border-radius:3cqw}
.mc.dim{filter:grayscale(1) brightness(.45);opacity:.75}
/* new parallels */
.mc.p-ruby{--fr:#f43f5e;--fr2:#7f1d1d;background-image:linear-gradient(145deg,#ffe4e6,#f43f5e 25%,#7f1d1d 50%,#fb7185 70%,#9f1239 85%,#ffe4e6);background-size:220% 220%;animation:refr 4.5s linear infinite;box-shadow:0 0 0 1px #000,0 0 14px #f43f5e77}
.mc.p-emerald{--fr:#34d399;--fr2:#064e3b;background-image:linear-gradient(145deg,#d1fae5,#10b981 25%,#064e3b 50%,#6ee7b7 70%,#047857 85%,#d1fae5);background-size:220% 220%;animation:refr 4s linear infinite;box-shadow:0 0 0 1px #000,0 0 18px #34d39988}
.mc.p-prism{--fr:#f9a8d4;--fr2:#6d28d9;background:conic-gradient(from var(--sfa,0deg),#ff4d6d,#ffb84d,#fff35c,#5cff8a,#4dd2ff,#7a5cff,#ff4dd8,#ff4d6d);animation:sfspin 4s linear infinite;box-shadow:0 0 0 1px #000,0 0 24px #f472b6aa}
.mc.p-prism .mc-art{background:repeating-conic-gradient(from 0deg at 50% 50%,#ff4d6d55 0 20deg,#ffb84d55 20deg 40deg,#fff35c55 40deg 60deg,#5cff8a55 60deg 80deg,#4dd2ff55 80deg 100deg,#7a5cff55 100deg 120deg),radial-gradient(circle,var(--c1),#000)}
.mc.p-ruby .mc-in::after,.mc.p-emerald .mc-in::after,.mc.p-prism .mc-in::after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#ffffff40 45%,transparent 60%);background-size:260% 100%;animation:shine 3.4s linear infinite;mix-blend-mode:overlay}
/* patch variants */
.mc-relic i.cape{background:linear-gradient(100deg,transparent 0 10%,#ffffff30 18%,transparent 26%),repeating-linear-gradient(80deg,var(--c1) 0 6%,color-mix(in srgb,var(--c1) 70%,#000) 6% 12%)}
.mc-relic i.logo{display:grid;place-items:center;background:repeating-linear-gradient(60deg,#ffffff18 0 .6px,transparent .6px 2px),radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c1) 80%,#fff),var(--c1));clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%);box-shadow:none;outline:.6cqw dashed var(--gold);outline-offset:-1.6cqw}
.mc-relic i.logo b{font-family:var(--display);font-size:9cqw;color:#fff;text-shadow:.5cqw .5cqw 0 #000}
.mc-relic .tri{display:grid;gap:1cqw;width:100%}
.mc-relic .tri i{aspect-ratio:2.6/1;background:repeating-linear-gradient(45deg,#ffffff1a 0 .5px,transparent .5px 2px),radial-gradient(circle,#00000055 .9px,transparent 1.2px) 0 0/3.4px 3.4px,var(--sh,var(--c1))}
.mc-auto .ins{display:block;font-family:var(--sig);font-size:6cqw;color:#1d3f9e;line-height:1}
.mc-auto.dual{bottom:26%;padding-top:.4cqw}.mc-auto.dual .sg{font-size:8.4cqw}
.mc-lv{position:absolute;right:3.4cqw;bottom:22%;z-index:7;font-family:var(--display);font-size:6.4cqw;letter-spacing:.04em;padding:.4cqw 2cqw;border-radius:1.4cqw;background:linear-gradient(180deg,#4ade80,#15803d);color:#fff;text-shadow:.4cqw .4cqw 0 #000;box-shadow:0 0 0 .5cqw #000,0 0 2cqw #4ade8099}
/* thanos 1/1 */
.mc.thanos{background:conic-gradient(from var(--sfa,0deg),#5b21b6,#ca8a04,#fde68a,#7c3aed,#ca8a04,#3b0764,#5b21b6);animation:sfspin 4s linear infinite;box-shadow:0 0 0 1px #000,0 0 30px #a855f7,0 0 60px #ca8a0466}
.mc.thanos .mc-art{background:radial-gradient(circle at 50% 50%,#7c3aed,#2e1065 55%,#0b0414),repeating-conic-gradient(from 0deg at 50% 50%,#fde68a22 0 6deg,transparent 6deg 12deg)}
.mc.thanos .mc-head{border-color:#fde68a;background:radial-gradient(circle at 35% 30%,#a78bfa,#5b21b6 55%,#1e0b3a)}
.mc.thanos .mc-name{color:#fde68a;font-size:13cqw}
.mc.thanos .mc-in::after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#fde68a55 45%,transparent 60%);background-size:260% 100%;animation:shine 3s linear infinite;mix-blend-mode:overlay}
.th-gems{position:absolute;left:50%;top:44%;width:0;height:0;z-index:6}
.th-gems i{position:absolute;width:9cqw;aspect-ratio:1;margin:-4.5cqw;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:radial-gradient(circle at 35% 30%,#fff,var(--sc) 40%,#000);filter:drop-shadow(0 0 2cqw var(--sc));transform:rotate(var(--a)) translateY(-34cqw) rotate(calc(var(--a)*-1))}
/* infinity stone card */
.mc.stone{background:conic-gradient(from var(--sfa,0deg),var(--sc),#fff,var(--sc),#000,var(--sc));animation:sfspin 3s linear infinite;box-shadow:0 0 0 1px #000,0 0 30px var(--sc)}
.mc.stone .mc-in{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--sc) 45%,#000),#050308 70%);align-items:center;justify-content:space-between;padding:5cqw 0}
.st-sky{position:absolute;inset:0;background:radial-gradient(circle,#fff 0 .4cqw,transparent .7cqw) 0 0/11cqw 13cqw,radial-gradient(circle,#fff8 0 .3cqw,transparent .6cqw) 5cqw 4cqw/17cqw 9cqw;animation:cosmo 8s linear infinite}
.st-top{position:relative;font-family:var(--mono);font-weight:700;font-size:5cqw;letter-spacing:.3em;color:#fff}
.st-gem{position:relative;width:46cqw;aspect-ratio:1;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:radial-gradient(circle at 35% 30%,#fff,var(--sc) 35%,color-mix(in srgb,var(--sc) 40%,#000) 100%);filter:drop-shadow(0 0 4cqw var(--sc));animation:gempulse 2s ease-in-out infinite}
@keyframes gempulse{50%{transform:scale(1.08);filter:drop-shadow(0 0 8cqw var(--sc))}}
.st-name{position:relative;font-family:var(--display);font-size:15cqw;line-height:.9;text-align:center;color:#fff;text-shadow:0 0 4cqw var(--sc),1cqw 1cqw 0 #000}
.st-name small{display:block;font-size:8cqw;letter-spacing:.2em;color:var(--sc)}
.st-ser{position:relative;font-family:var(--mono);font-weight:700;font-size:5cqw;padding:.6cqw 3cqw;border-radius:1.4cqw;background:linear-gradient(180deg,#fff3c2,#c9a24a);color:#1a1204}
/* infinity vault */
.vault{position:relative;border-radius:20px;padding:24px;border:3px solid #000;box-shadow:6px 6px 0 #000;overflow:hidden;background:radial-gradient(circle at 50% 50%,#2a1546,#05030a 70%)}
.vault::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff 0 1px,transparent 1.6px) 0 0/40px 46px,radial-gradient(circle,#fff8 0 1px,transparent 1.5px) 20px 13px/60px 33px;animation:cosmo 20s linear infinite}
.ring{position:relative;width:min(420px,86vw);aspect-ratio:1;margin:10px auto;border-radius:50%;border:14px solid #b8860b;box-shadow:inset 0 0 0 6px #ffe08a,0 0 0 6px #7a5410,0 0 60px #ffc83d55}
.ring .sock{position:absolute;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:#1a1124;box-shadow:inset 0 0 20px #000}
.ring .sock.on{background:radial-gradient(circle at 35% 30%,#fff,var(--sc) 35%,color-mix(in srgb,var(--sc) 40%,#000));filter:drop-shadow(0 0 16px var(--sc));animation:gempulse 2s ease-in-out infinite}
.ring .lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:#fff;text-shadow:0 0 6px #000;white-space:nowrap}
.ring .core{position:absolute;inset:30%;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:clamp(22px,5vw,34px);line-height:.95;color:#ffe08a;text-shadow:3px 3px 0 #000}
/* upgrade */
.uprow{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.pips{display:flex;gap:4px;margin:6px 0}.pips i{width:22px;height:7px;border-radius:3px;background:#ffffff18}.pips i.on{background:#4ade80;box-shadow:0 0 6px #4ade80}
@media(max-width:560px){.uprow{grid-template-columns:80px 1fr}.uprow>:last-child{grid-column:1/-1}}
/* slab */
.slab{container-type:inline-size;position:relative;width:100%;padding:16% 5% 5%;border-radius:12px;background:linear-gradient(160deg,#ffffff2e,#ffffff0c 40%,#ffffff22);box-shadow:inset 0 0 0 1px #ffffff66,inset 0 0 18px #ffffff14,0 8px 18px #000a}
.slab .lab{position:absolute;left:5cqw;right:5cqw;top:4cqw;height:10cqw;border-radius:2cqw;background:linear-gradient(180deg,#f8f8f8,#dcdcdc);color:#111;display:flex;align-items:center;justify-content:space-between;padding:0 3cqw;font-family:var(--mono);font-weight:700;box-shadow:inset 0 0 0 .4cqw #c8102e}
.slab .lab span{font-size:3.6cqw;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slab .lab b{font-family:var(--display);font-weight:400;font-size:8cqw;color:#c8102e;letter-spacing:.02em}
.slab::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,#ffffff26 44%,transparent 56%);pointer-events:none}
button.slab{border:0;cursor:pointer}

/* ================= HOME ================= */
.hero-banner{position:relative;overflow:hidden;border-radius:18px;border:3px solid #000;box-shadow:6px 6px 0 #000;padding:22px;margin-bottom:18px;
 background:radial-gradient(circle at 80% 50%,#ffc83d33,transparent 50%),repeating-conic-gradient(from 0deg at 80% 50%,#a3122a 0 8deg,#7a0d1a 8deg 16deg)}
.hero-banner::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#00000040 1px,transparent 1.6px);background-size:8px 8px;pointer-events:none}
.hero-banner>*{position:relative;z-index:1}
.hero-banner h2{font-size:48px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.stat{background:#000a;border:1px solid #ffffff22;border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--gold)}
.stat span{font-size:12px;color:#e7d9de;letter-spacing:.06em;text-transform:uppercase}
.showcase{border-radius:16px;padding:16px;border:2px solid #5a4330;background:linear-gradient(115deg,#ffffff07 0 18%,transparent 18% 40%,#ffffff05 40% 46%,transparent 46%),linear-gradient(180deg,#1a120d,#0f0a07);box-shadow:inset 0 0 40px #000,0 14px 40px #0008;margin-bottom:18px}
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:10px 6px 14px;border-bottom:12px solid transparent;border-image:linear-gradient(180deg,#8a5a34,#4a2e18) 1}
@media(max-width:640px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
.eslot{aspect-ratio:5/7;border:2px dashed #ffffff30;border-radius:10px;display:grid;place-items:center;color:#ffffff55;font-family:var(--mono);font-size:11px;text-align:center;padding:6px}

/* ================= SHOP ================= */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pk{background:var(--panel);border:2px solid #000;box-shadow:5px 5px 0 #000;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pk h3{font-size:26px}
.pk p{color:var(--dim);font-size:14px;flex:1}
.odds{font-family:var(--mono);font-size:11px;color:var(--dim);display:grid;gap:2px}
.odds span{display:flex;justify-content:space-between}
.foil{container-type:inline-size;position:relative;aspect-ratio:3/4;width:62%;margin:0 auto;border-radius:8px;overflow:hidden;
 background:linear-gradient(140deg,var(--p1),var(--p2));box-shadow:0 10px 20px #000a,inset 0 0 0 1.2cqw #ffffff22}
.foil::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 45%,#ffffff1a 0 8deg,transparent 8deg 16deg)}
.foil::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff40 45%,transparent 60%);background-size:260% 100%;animation:shine 3s linear infinite}
.foil .crimp{position:absolute;left:0;right:0;height:7cqw;background:repeating-linear-gradient(90deg,#00000044 0 3cqw,#ffffff22 3cqw 6cqw)}
.foil .crimp.t{top:0}.foil .crimp.b{bottom:0}
.foil .ttl{position:absolute;left:0;right:0;top:30%;text-align:center;z-index:2;font-family:var(--display);font-size:18cqw;line-height:.85;color:#fff;text-shadow:1.2cqw 1.2cqw 0 #000}
.foil .ttl small{display:block;font-size:8cqw;color:var(--gold);margin-top:2cqw}
.boxart{container-type:inline-size;position:relative;aspect-ratio:4/3;width:80%;margin:0 auto;border-radius:6px;background:linear-gradient(160deg,#2a1240,#12051f);box-shadow:0 0 0 1.2cqw #000,0 0 0 2cqw #ffc83d,0 14px 24px #000c;display:grid;place-items:center}
.boxart b{font-family:var(--display);font-size:15cqw;line-height:.9;text-align:center;color:#ffc83d;text-shadow:1cqw 1cqw 0 #000}
.boxart b small{display:block;font-size:7cqw;color:#fff}
.boxart i{position:absolute;left:-1%;right:-1%;top:46%;height:10%;background:linear-gradient(#ffffff55,#ffffff22),#d8bd85;opacity:.7}

/* ================= OVERLAYS ================= */
.ov{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 40%,#1d0f1c,#040308 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;overflow:auto;user-select:none;-webkit-user-select:none}
.ov .x{position:absolute;top:12px;right:12px}
.ov-t{font-family:var(--display);font-size:clamp(30px,6vw,48px);letter-spacing:1px;text-shadow:3px 3px 0 #000;text-align:center}
.ov-s{color:var(--dim);text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.rpack{container-type:inline-size;position:relative;width:min(280px,70vw);aspect-ratio:3/4;border-radius:10px;touch-action:none;cursor:grab;
 background:linear-gradient(140deg,var(--p1),var(--p2));box-shadow:0 20px 40px #000c,inset 0 0 0 1.2cqw #ffffff22;overflow:hidden}
.rpack::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 45%,#ffffff1a 0 8deg,transparent 8deg 16deg)}
.rpack .ttl{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:var(--display);font-size:16cqw;line-height:.85;color:#fff;text-shadow:1.2cqw 1.2cqw 0 #000;pointer-events:none}
.rpack .ttl small{display:block;font-size:7cqw;color:var(--gold);margin-top:2cqw}
.rp-strip{position:absolute;left:0;right:0;top:0;height:11%;z-index:4;background:linear-gradient(140deg,var(--p1),var(--p2));border-bottom:2px dashed #0008;transition:transform .45s cubic-bezier(.3,.6,.4,1),opacity .45s}
.rp-strip::before{content:"";position:absolute;inset:0 0 50% 0;background:repeating-linear-gradient(90deg,#00000044 0 4px,transparent 4px 8px)}
.rp-strip::after{content:"✂  DRAG TO TEAR";position:absolute;right:5%;bottom:10%;font-family:var(--mono);font-weight:700;font-size:4cqw;letter-spacing:.1em;color:#fffb}
.rp-tear{position:absolute;top:calc(11% - 3px);height:6px;left:calc(var(--lo,0)*1%);width:calc(var(--w,0)*1%);z-index:5;background:#140a02;box-shadow:0 1px 0 #fff9;
 clip-path:polygon(0 30%,5% 0,10% 40%,15% 5%,20% 45%,25% 0,30% 35%,35% 10%,40% 50%,45% 0,50% 40%,55% 5%,60% 45%,65% 0,70% 35%,75% 10%,80% 50%,85% 0,90% 40%,95% 5%,100% 30%,100% 100%,0 100%)}
.rpack.ripped .rp-strip{transform:translate(40%,-160%) rotate(22deg);opacity:0}.rpack.ripped .rp-tear{opacity:0}
.rpack.ripped{animation:ripPop .35s ease-out}
@keyframes ripPop{40%{transform:scale(1.06)}}
.stage{width:min(260px,64vw);perspective:1000px}
.flipc{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.flipc.open{transform:rotateY(180deg)}
.flipc .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipc .f.fr{transform:rotateY(180deg)}
.flipc.glow-L:not(.open){filter:drop-shadow(0 0 22px #f59e0b)}
.flipc.glow-E:not(.open){filter:drop-shadow(0 0 16px #a855f7)}
.pulled{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:720px}
.pulled .cw{width:84px}
.cardin{animation:cin .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes cin{from{transform:translateY(-30px) scale(.8);opacity:0}}
/* walkout */
.wo{position:fixed;inset:0;z-index:700;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#1a0f14,#050203 70%);overflow:hidden;cursor:pointer;animation:wofade .3s ease-out}
.wo.out{animation:woout .35s ease-in forwards}
@keyframes wofade{from{opacity:0}}@keyframes woout{to{opacity:0}}
.wo-rays{position:absolute;left:50%;top:45%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,var(--wc) 0 3deg,transparent 3deg 15deg);opacity:0;mask-image:radial-gradient(circle,#000 0,transparent 42%);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 42%);animation:worays 14s linear infinite,woin .8s .2s ease-out forwards}
@keyframes worays{to{transform:rotate(360deg)}}@keyframes woin{to{opacity:.5}}
.wo-glow{position:absolute;left:50%;top:45%;width:70vmin;height:70vmin;margin:-35vmin 0 0 -35vmin;border-radius:50%;background:radial-gradient(circle,var(--wc),transparent 65%);opacity:0;animation:woglow 1.6s .1s ease-out forwards}
@keyframes woglow{60%{opacity:.75}100%{opacity:.5}}
.wo-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:woflash .7s 1.25s ease-out}
@keyframes woflash{12%{opacity:.95}100%{opacity:0}}
.wo-hint{position:absolute;top:10%;left:0;right:0;text-align:center;font-family:var(--mono);letter-spacing:.3em;font-size:12px;color:var(--wc);text-transform:uppercase;animation:wohint 1.3s ease-out forwards}
@keyframes wohint{0%{opacity:0;letter-spacing:.8em}30%,85%{opacity:1}100%{opacity:0}}
.wo-stage{position:relative;width:min(250px,60vw);perspective:900px;margin-top:-6vh}
.wo-spin{position:relative;transform-style:preserve-3d;animation:wospin 1.5s cubic-bezier(.2,.7,.25,1) both}
@keyframes wospin{0%{transform:translateY(40vh) scale(.4) rotateY(1260deg)}55%{transform:translateY(0) scale(.9) rotateY(400deg)}100%{transform:none}}
.wo-front{backface-visibility:hidden;filter:drop-shadow(0 0 30px var(--wc))}
.wo-back{position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);border-radius:12px;background:radial-gradient(circle at 50% 40%,var(--wc),#1b0d06 70%);border:3px solid var(--wc);display:grid;place-items:center;font-family:var(--display);font-size:min(56px,13vw);color:#fff;text-shadow:0 0 18px var(--wc)}
.wo-txt{position:absolute;left:0;right:0;bottom:6%;text-align:center;padding:0 16px}
.wo-kind{font-family:var(--display);font-size:clamp(34px,8vw,66px);line-height:.95;letter-spacing:.05em;color:#fff;text-shadow:0 0 24px var(--wc),0 4px 0 #0008;opacity:0;animation:wokind .6s 1.45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes wokind{from{opacity:0;transform:scale(1.8)}to{opacity:1;transform:none}}
.wo-name{margin-top:6px;font-weight:700;font-size:clamp(15px,3.6vw,20px);opacity:0;animation:wosub .5s 1.8s ease-out forwards}
.wo-tap{margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dim);opacity:0;animation:wosub .5s 2.3s ease-out forwards}
@keyframes wosub{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wo-conf{position:absolute;inset:0;pointer-events:none}
.wo-conf i{position:absolute;top:-4%;width:8px;height:14px;background:var(--wc);opacity:0;animation:woconf 2.6s 1.3s linear forwards}
@keyframes woconf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),110vh) rotate(var(--r))}}
/* box */
.bx{position:relative;width:min(480px,92vw);aspect-ratio:16/10;perspective:1100px;touch-action:none}
.bx-body{position:absolute;inset:0;border-radius:8px;background:linear-gradient(160deg,#2a1240,#12051f);box-shadow:0 0 0 4px #000,0 0 0 8px #ffc83d,0 30px 40px -10px #000d}
.bx-inside{position:absolute;inset:6%;border-radius:4px;background:linear-gradient(#0a0410,#1d0b2e);box-shadow:inset 0 10px 24px #000c;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4%;padding:4%}
.bx-pk{border:none;border-radius:4px;background:linear-gradient(140deg,#c1121f,#3a0611);box-shadow:0 0 0 2px #000,0 6px 10px #000b;display:grid;place-items:center;font-family:var(--display);font-size:clamp(14px,4vw,22px);color:#fff;text-shadow:2px 2px 0 #000;animation:cin .4s both;animation-delay:calc(var(--i)*.07s)}
.bx-pk:hover:not(.gone){filter:brightness(1.2);box-shadow:0 0 0 3px #ffc83d,0 6px 10px #000b}
.bx-pk.gone{background:#12061c;box-shadow:inset 0 4px 10px #000;color:transparent;text-shadow:none;cursor:default}
.bx-flap{position:absolute;left:0;right:0;height:50%;z-index:3;background:linear-gradient(170deg,#3a1a5a,#1a0a2a);transition:transform .7s cubic-bezier(.3,.7,.25,1.1);backface-visibility:hidden;display:grid;place-items:center;pointer-events:none}
.bx-flap.t{top:0;transform-origin:50% 0;border-radius:8px 8px 0 0}.bx-flap.b{bottom:0;transform-origin:50% 100%;border-radius:0 0 8px 8px}
.bx-flap b{font-family:var(--display);font-size:clamp(26px,7vw,44px);color:#ffc83d;text-shadow:3px 3px 0 #000;line-height:.9;text-align:center}
.bx-flap small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#fff}
.bx.open .bx-flap.t{transform:rotateX(-150deg)}.bx.open .bx-flap.b{transform:rotateX(150deg)}
.bx-tape{position:absolute;left:-1%;right:-1%;top:44%;height:12%;z-index:4;background:linear-gradient(#ffffff40,#ffffff10 50%,#ffffff30),repeating-linear-gradient(90deg,#d9c08a 0 30px,#d2b67c 30px 31px);opacity:.85;cursor:none}
.bx.open .bx-tape{opacity:0;pointer-events:none;transition:opacity .3s}
.bx-cut{position:absolute;left:0;top:calc(50% - 1.5px);height:3px;width:0;background:#1a0e04;box-shadow:0 0 6px #000;z-index:5;pointer-events:none}
.bx-knife{position:absolute;z-index:6;width:64px;height:20px;pointer-events:none;transform:translate(-8px,-10px) rotate(-12deg);display:none}
.bx-knife i{position:absolute;left:0;top:4px;width:26px;height:12px;background:linear-gradient(180deg,#f2f4f7,#9aa3ab);clip-path:polygon(0 50%,100% 0,100% 100%)}
.bx-knife b{position:absolute;left:24px;top:2px;width:40px;height:16px;border-radius:4px;background:linear-gradient(180deg,#ffc83d,#b8860b);box-shadow:0 2px 4px #000a}
/* album */
.album-team{margin:22px 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.album-team h3{color:var(--tc)}
.album-team .bar{flex:1;min-width:120px;max-width:260px;height:8px;background:#000;border-radius:9px;overflow:hidden}
.album-team .bar i{display:block;height:100%;background:var(--tc)}
.aslot{position:relative}
.aslot .nm{position:absolute;left:6%;right:6%;bottom:40%;text-align:center;font-family:var(--display);font-size:16px;color:#ffffff99;text-shadow:2px 2px 0 #000;z-index:3;pointer-events:none;line-height:1}
.aslot .cnt{position:absolute;top:-6px;right:-6px;z-index:9;font-family:var(--mono);font-size:10px;font-weight:700;background:var(--gold);color:#111;border-radius:999px;padding:1px 6px;border:1px solid #000}
/* modal */
.mod{position:fixed;inset:0;z-index:600;background:#05060cdd;backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
.mbox{background:var(--panel);border:2px solid #000;box-shadow:6px 6px 0 #000;border-radius:16px;width:100%;max-width:820px;padding:20px;margin:auto 0}
.detail{display:grid;grid-template-columns:minmax(170px,250px) 1fr;gap:22px;align-items:start}
@media(max-width:560px){.detail{grid-template-columns:1fr}.detail>.cw{width:min(220px,70%);margin:0 auto}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0}
.kv span{color:var(--dim)}
/* grading */
.gslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:700px}
.gslot{border-radius:14px;padding:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;min-height:230px;text-align:center}
.gslot.empty{border:2px dashed var(--line);cursor:pointer;color:var(--dim)}
.gslot.empty b{font-size:34px;line-height:1}
.gslot .cw{width:100%;filter:saturate(.6) brightness(.8)}
.gslot .tm{font-family:var(--mono);font-size:15px;color:var(--gold)}
.greveal{position:fixed;inset:0;z-index:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle,#1d140b,#030201 75%);overflow:hidden;cursor:pointer;padding:16px}
.gr-rays{position:absolute;width:180vmax;height:180vmax;background:repeating-conic-gradient(#ffffff10 0 6deg,transparent 6deg 18deg);animation:worays 14s linear infinite}
.greveal.g10 .gr-rays{background:repeating-conic-gradient(#ffd67a44 0 6deg,transparent 6deg 18deg);animation-duration:5s}
.gr-slab{position:relative;width:min(240px,62vw);animation:grdrop .7s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes grdrop{from{transform:translateY(-60vh) rotate(-8deg)}}
.gr-txt{position:relative;text-align:center;animation:wosub .4s .6s both}
.gr-txt b{display:block;font-family:var(--display);font-size:72px;line-height:1;color:#ffd67a;text-shadow:0 0 30px #e8b83c}
.gr-txt span{font-family:var(--display);font-size:22px;letter-spacing:.2em}
/* show */
.buyers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.buyer{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:linear-gradient(#3a2414,#24160b);border:1px solid #ffffff1c;box-shadow:inset 0 3px 0 #c0392b}
.buyer .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#000;border:2px solid #ffffff33}
.buyer b{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.buyer p{font-size:13px;color:#e8d9c8;margin:0}
.buyer .done{font-family:var(--mono);font-size:11px;color:var(--dim)}
.offer{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:10px;background:var(--panel2);margin-bottom:8px}
.offer b{font-family:var(--display);font-size:20px;color:var(--gold)}
/* missions */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vt{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.vt.lock{opacity:.4;cursor:not-allowed}
.vt:not(.lock):hover{border-color:var(--gold)}
.vt .vi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle,var(--vc),#000);border:2px solid var(--vc)}
.vt h4{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1}

function annPop(force){if(!ANN||(!force&&(S.annSeen||0)>=ANN.at))return;S.annSeen=ANN.at;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

 const a={t,at:Date.now()};annSet(a);S.annSeen=0;annPop(true);

const SAKEY='cc-shared-art-ids';
const shareable=id=>!!id&&!/^cu\d/.test(id);
function shName(id,v){if(!NET.on||!NET.can||!shareable(id))return;const d=NET.db.doc('studio_names/'+id);(v?d.set({v,at:Date.now(),by:NET.me}):d.delete()).catch(()=>toast("Couldn't share that name with friends right now."))}
function shArt(id,url){if(!NET.on||!NET.can||!shareable(id))return;const d=NET.db.doc('studio_art/'+id);(url?d.set({img:url,at:Date.now(),by:NET.me}):d.delete()).catch(()=>toast(url?"Couldn't share that headshot with friends right now.":"Couldn't remove that headshot for friends right now."))}
function studioShareInit(db){let firstN=true,firstA=true;
 db.collection('studio_names').onSnapshot(sn=>{const sh={};sn.docs.forEach(d=>{const x=d.data();if(x&&typeof x.v==='string'&&shareable(d.id))sh[d.id]=x.v.slice(0,28)});
  if(firstN){firstN=false;if(!sn.docs.length&&studioOK&&NET.can){Object.keys(S.names).filter(shareable).forEach(id=>shName(id,S.names[id]));return}}
  const mine={};Object.keys(S.names).forEach(k=>{if(!shareable(k))mine[k]=S.names[k]});S.names=Object.assign(mine,sh);
  applyNames();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!document.querySelector('.nm-in:focus')&&!document.querySelector('.mod'))render()},()=>{});
 db.collection('studio_art').onSnapshot(sn=>{let was=[];try{was=JSON.parse(localStorage.getItem(SAKEY)||'[]')}catch(e){}
  if(firstA){firstA=false;if(!sn.docs.length&&studioOK&&NET.can){Object.keys(ART).filter(shareable).forEach(id=>shArt(id,ART[id]));return}}
  const now=[];sn.docs.forEach(d=>{const x=d.data();if(x&&typeof x.img==='string'&&/^data:image\/(webp|jpeg|png);/.test(x.img)&&HB[d.id]){ART[d.id]=x.img;now.push(d.id)}});
  was.forEach(id=>{if(!now.includes(id))delete ART[id]});try{localStorage.setItem(SAKEY,JSON.stringify(now))}catch(e){}
  saveArt();if(!document.querySelector('.nm-in:focus')&&!document.querySelector('.mod'))render()},()=>{})}
async function downloadGame(){if(!SRC0||!SRC0.js)return toast("Sorry, this copy of the game can't make a download.");
 const names={};const N=Object.assign({},BAKED.names,S.names);for(const id in N)if(!/^cu\d/.test(id)&&N[id])names[id]=N[id];
 const art={};for(const id in ART)if(!/^cu\d/.test(id)&&HB[id])art[id]=ART[id];
 const data=JSON.stringify({names,art,rel:REL,code:CODEH,ann:ANN,at:Date.now()}).replace(/</g,'\\u003c');
 const SC='<'+'script',SE='<'+'/script>';
 const html='<!DOCTYPE html>\n<html lang="en">\n<head>\n'+SRC0.head+'\n</head>\n<body>'+SRC0.body+'\n'+SC+' id="cc-baked">window.CC_BAKED='+data+';'+SE+'\n'+SC+'>'+SRC0.js+SE+'\n</body>\n</html>\n';
 const done=()=>toast(`⬇️ Downloaded index.html with ${Object.keys(names).length} names and ${Object.keys(art).length} headshots. Upload it to GitHub!`);
 if(window.claude&&typeof window.claude.use==='function'){let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:'index.html',data:new Blob([html],{type:'text/html'})});done()}catch(e){const c=e&&e.code;toast(c==='declined'?'Download cancelled.':c==='rate_limited'?'A download box is already open. Finish that one first.':"Couldn't download right now. Try again in a moment.")}return}}
 try{const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);done()}catch(e){toast("Your browser blocked the download.")}}

async function netInit(){
 if(!(window.claude&&typeof window.claude.use==='function')){NET.note='Online features work when you open the game from its claude.ai link.';return}
 const tm=setTimeout(()=>{if(!NET.on){NET.note='Can\'t reach your friends right now. Your game still saves on this device.';liveRender()}},10000);
 try{const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user){clearTimeout(tm);NET.note='Sign in to claude.ai to play with friends. Your game still saves on this device.';liveRender();return}
  NET.db=db;NET.user=user;NET.me=await user.id();
  if(!NET.me){clearTimeout(tm);NET.note='Online features aren\'t available on this view.';liveRender();return}
  const cw=user.can('data.write');NET.can=cw!==false;
  try{const snap=await db.doc(`data/users/${NET.me}/save`).get();
   if(snap.exists){const d=snap.data();if(d&&d.s&&(d.at||0)>(S.savedAt||0)){const ns=JSON.parse(d.s);if(ns&&Array.isArray(ns.cards)){S=ns;normalize();relInit();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}toast('☁️ Loaded your saved game from your account')}}}}catch(e){}
  NET.on=true;clearTimeout(tm);NET.note='';
  db.collection('players').onSnapshot(sn=>{const p={};sn.docs.forEach(d=>{p[d.id]=d.data()});NET.players=p;
   user.profiles(Object.keys(p).concat([NET.me])).then(ps=>{for(const id in ps)NET.names[id]=(ps[id]&&ps[id].name)||'A friend';liveRender()}).catch(()=>{});
   checkWarPrize();liveRender()},()=>{});
  studioShareInit(db);relListen(db);
  db.collection('claims').onSnapshot(sn=>{const c={};sn.docs.forEach(d=>{c[d.id]=d.data()});NET.claims=c},()=>{});
  db.collection('gifts').where('to','==',NET.me).onSnapshot(sn=>{NET.gifts=sn.docs.map(d=>({id:d.id,...d.data()}));liveRender()},()=>{});
  db.collection('trades').where('to','==',NET.me).onSnapshot(sn=>{NET.tradesIn=sn.docs.map(d=>({id:d.id,...d.data()}));liveRender()},()=>{});
  db.collection('trades').where('from','==',NET.me).onSnapshot(sn=>{NET.tradesOut=sn.docs.map(d=>({id:d.id,...d.data()}));settleTrades();liveRender()},()=>{});
  NET.dirty=true;syncNow();liveRender();
 }catch(e){clearTimeout(tm);NET.note='Online features are unavailable right now. Your game still saves on this device.';liveRender()}}

 let to=friends[0];const stones=Object.keys(S.stones);

  m.querySelector('#gX').onclick=()=>m.remove();m.querySelector('#gTo').onchange=e=>{to=e.target.value};
  m.querySelectorAll('[data-gc]').forEach(b=>b.onclick=async()=>{const c=byU(+b.dataset.gc);if(!c)return;removeCard(c.u);save();m.remove();
   try{await NET.db.collection('gifts').add({to,from:NET.me,card:compact(c),at:Date.now()});toast(`🎁 Sent ${HB[c.id].n} to ${pname(to)}`);sfx('coin')}catch(e){c.u=S.uid++;S.cards.push(c);save();toast('Couldn\'t send that gift. The card is back in your collection.')}render()});
  m.querySelectorAll('[data-gs]').forEach(b=>b.onclick=async()=>{const k=b.dataset.gs;if(!S.stones[k])return;delete S.stones[k];save();m.remove();

 draw();document.body.appendChild(m)}

 try{await NET.db.doc('gifts/'+id).delete()}catch(e){return toast('Couldn\'t open that gift. Try again.')}
 NET.gifts=NET.gifts.filter(x=>x.id!==id);
 if(g.stone&&STONES.some(x=>x[0]===g.stone)){const c={u:0,stone:g.stone,noFeed:true};claim('stone_'+g.stone);ripFlow([c],{name:'Gift from '+pname(g.from),sub:'INFINITY',p1:'#7c3aed',p2:'#12051f'},()=>render());return}
 if(validCard(g.card)){const c=Object.assign({},g.card,{u:0,grade:g.card.grade||0,noFeed:true});ripFlow([c],{name:'Gift from '+pname(g.from),sub:'GIFT',p1:'#16a34a',p2:'#052e16'},()=>render())}else toast('That gift was empty.')}

function proposeSwap(){const friends=Object.keys(NET.players).filter(id=>id!==NET.me&&(NET.players[id].shelf||[]).length);if(!friends.length)return toast('No friends have cards to swap yet.');
 let to=friends[0],want=null,give=null;const m=document.createElement('div');m.className='mod';

  <div class="row" style="margin-top:14px"><button class="btn red" id="sGo" ${want==null||give==null?'disabled':''}>Send offer</button><span class="sub" style="margin:0;font-size:13px">Your card is held until they answer. Cancel any time to get it back.</span></div></div>`;

 draw();document.body.appendChild(m)}
async function answerTrade(id,ok){const t=NET.tradesIn.find(x=>x.id===id);if(!t||t.status!=='open')return;
 if(!ok){try{await NET.db.doc('trades/'+id).update({status:'declined'})}catch(e){}return render()}
 const mine=S.cards.find(c=>c.u===t.want.u&&c.id===t.want.id)||S.cards.find(c=>c.id===t.want.id&&c.par===t.want.par&&!S.pins.includes(c.u));
 if(!mine){try{await NET.db.doc('trades/'+id).update({status:'declined'})}catch(e){}return toast('You no longer have that card, so the swap was declined.')}
 if(!validCard(t.give))return toast('That offer looks broken.');
 removeCard(mine.u);save();
 try{await NET.db.doc('trades/'+id).update({status:'accepted',got:compact(mine)})}catch(e){mine.u=S.uid++;S.cards.push(mine);save();return toast('Couldn\'t finish the swap. Try again.')}
 bumpFriend(t.from);const c=Object.assign({},t.give,{u:0,noFeed:true});ripFlow([c],{name:'Swap with '+pname(t.from),sub:'SWAP',p1:'#0d9488',p2:'#042f2e'},()=>render())}
async function cancelTrade(id){const t=NET.tradesOut.find(x=>x.id===id);if(!t||t.status!=='open')return;try{await NET.db.doc('trades/'+id).update({status:'cancelled'})}catch(e){return toast('Couldn\'t cancel. Try again.')}}
function settleTrades(){S.doneTrades=S.doneTrades||[];
 NET.tradesOut.forEach(t=>{if(t.status==='open'||S.doneTrades.includes(t.id))return;S.doneTrades.push(t.id);S.doneTrades=S.doneTrades.slice(-200);
  if(t.status==='accepted'&&validCard(t.got)){bumpFriend(t.to);const c=Object.assign({},t.got,{u:0,noFeed:true});addCards([c]);toast(`🔁 ${pname(t.to)} accepted! You got ${HB[c.id].n}`);sfx('special')}
  else if(validCard(t.give)){const c=Object.assign({},t.give,{u:S.uid++});S.cards.push(c);toast(t.status==='cancelled'?'Swap cancelled. Your card is back.':`${pname(t.to)} said no thanks. Your card is back.`)}
  save();NET.db.doc('trades/'+t.id).delete().catch(()=>{})})}
/* team wars */
const curWeek=()=>weekNo(new Date());
function warTotals(wk){const tot={};Object.values(NET.players).forEach(p=>{if(p.war&&p.war.wk===wk&&p.war.team!=null)tot[p.war.team]=(tot[p.war.team]||0)+(p.war.pts||0)});return tot}
function checkWarPrize(){const w=S.war;if(!w||w.wk===curWeek()||S.warPaid===w.wk)return;const tot=warTotals(w.wk);const best=Math.max(0,...Object.values(tot));
 S.warPaid=w.wk;if(w.pts>0&&tot[w.team]===best){S.prize=(S.prize||0)+1;toast(`🏆 ${TEAMS[w.team].n} won last week's Team War! A free Cosmic Pack is waiting in Packs.`)}save()}
function warPoints(heroes,vi){const w=S.war;if(!w||w.wk!==curWeek())return 0;if(!heroes.some(x=>x.h.t===w.team))return 0;const p=10+vi*5;w.pts=(w.pts||0)+p;return p}

function pickArt(id){upFor=id;const f=$('#fileIn');f.value='';f.click()}
function loadArt(id,file){if(!file||!file.type.startsWith('image/'))return toast("That file isn't an image.");
 const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=Math.min(320,s);
  c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,c.width,c.height);
  let url=c.toDataURL('image/webp',.85);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/jpeg',.85);
  const old=ART[id];ART[id]=url;if(!saveArt()){if(old)ART[id]=old;else delete ART[id];return}shArt(id,url);toast('🎨 Headshot added to '+HB[id].n+(NET.on&&NET.can&&shareable(id)?' for everyone':''));render()};img.src=rd.result};rd.readAsDataURL(file)}
$('#fileIn').onchange=e=>{if(upFor)loadArt(upFor,e.target.files[0])};
let studioTeam='all';
function nmRow(id,val,ph,label){return `<div class="nmrow"><input class="nm-in" data-nm="${id}" value="${esc(val)}" placeholder="${esc(ph||'')}" maxlength="28" aria-label="Name for ${esc(label||val)}"><button class="btn sm" data-nmsave="${id}">Save</button></div>`}
function vStudio(){const n=H.filter(h=>ART[h.id]).length;const teams=studioTeam==='all'?TEAMS.map((t,i)=>i):/^\d+$/.test(studioTeam)?[+studioTeam]:[];const other=studioTeam==='all'||studioTeam==='other';
 const upBtns=id=>`<div class="row"><button class="btn sm" data-up="${id}">${ART[id]?'Change':'Upload'}</button>${ART[id]?`<button class="btn ghost sm" data-rm="${id}">Remove</button>`:''}</div>`;
 const heroRow=h=>`<div class="srow" data-drop="${h.id}"><div class="cw">${cardHTML(mkc(h.id))}</div><div class="txt">${h.suit?nmRow(h.id,h.n,HB[h.base].n,h.n)+`<p>${esc(h.suit)} · leave the name blank to use the main hero's name (${esc(HB[h.base].n)}). Upload a separate headshot for this suit, or leave it to use the main one.</p>`:nmRow(h.id,h.n,h.n0,h.n)+`<p>${TN[h.tier]} · ⚡ ${esc(h.move)}${h.n!==h.n0?` · <i>was ${esc(h.n0)}</i>`:''}</p>`}</div>${upBtns(h.id)}</div>`;
 $('#view').innerHTML=`<h2>Studio</h2><p class="sub">Rename anyone: heroes, suit versions, your own heroes, villains, teams and headquarters. Type a new name and press <b>Save</b> (or Enter). Leave a name blank and save to get the original back. Upload headshots for heroes. They're cropped to a square.</p><p class="sub" style="margin-top:-4px">${NET.on&&NET.can?'🌍 <b>Shared:</b> new names and headshots change for everyone playing from the claude.ai link.':NET.on?'👀 You can only view here, so changes stay on this device.':'📱 Offline: changes stay on this device. Open the game from its claude.ai link to share them with everyone.'} Your own created heroes always stay yours.</p>
 <div class="row" style="margin-bottom:10px"><span class="tag" style="font-size:12px">🎨 ${n}/${H.length} heroes have headshots</span><span class="tag" style="font-size:12px">✏️ ${Object.keys(S.names).length} renamed</span><button class="btn sm" id="dlGame">⬇️ Download game with my changes</button><button class="btn ghost sm" id="stLock">🔒 Lock Studio</button><button class="btn ghost sm" id="bkC">Copy backup</button><button class="btn ghost sm" id="bkR">Restore backup</button></div>
 <div class="row" style="margin-bottom:10px"><button class="chip" aria-pressed="${studioTeam==='all'}" data-st="all">All</button><button class="chip" aria-pressed="${studioTeam==='other'}" data-st="other">Teams, villains & HQs</button>${TEAMS.map((t,i)=>`<button class="chip" aria-pressed="${studioTeam==i}" data-st="${i}">${esc(t.s)}</button>`).join('')}</div>
 ${annPanel()}${adminPanel()}${other?`<div class="album-team" style="--tc:var(--gold)"><h3>Team names</h3></div><div class="nmgrid">${TEAMS.map(t=>`<div class="nmcell"><span class="sw" style="background:${t.c1}"></span>${nmRow('team_'+t.k,t.n,t.n0,t.n)}${t.n!==t.n0?`<small>was ${esc(t.n0)}</small>`:''}</div>`).join('')}</div>
  <div class="album-team" style="--tc:#f87171"><h3>Villains</h3></div>${VILLAINS.map((v,i)=>`<div class="srow"><div class="cw">${cardHTML(mkc('vil'+i))}</div><div class="txt">${nmRow('vil'+i,v.n,v.n0||v.n,v.n)}<p>${v.e} Mission ${i+1}${v.n!==(v.n0||v.n)?` · <i>was ${esc(v.n0)}</i>`:''}</p></div></div>`).join('')}
  <div class="album-team" style="--tc:#38bdf8"><h3>Headquarters</h3></div><div class="nmgrid">${TEAMS.map(t=>{const hq=HB['hq_'+t.k];return `<div class="nmcell"><span class="sw" style="background:${t.c1}">${hq.art}</span>${nmRow(hq.id,hq.n,hq.n0||hq.n,hq.n)}<small>${esc(t.n)}</small></div>`}).join('')}</div>`:''}
 ${teams.map(i=>`<div class="album-team" style="--tc:${TEAMS[i].c1}"><h3>${esc(TEAMS[i].n)}</h3></div>${H.filter(h=>h.t===i).map(heroRow).join('')}`).join('')}
 ${S.custom.length&&studioTeam==='all'?`<div class="album-team" style="--tc:#e5e7eb"><h3>Your Creations</h3></div>${S.custom.map(x=>`<div class="srow" data-drop="${x.id}"><div class="cw">${cardHTML(mkc(x.id))}</div><div class="txt">${nmRow(x.id,x.n,'',x.n)}<p>${esc(TEAMS[x.t].n)} · ⚡ ${esc(x.move)}</p></div>${upBtns(x.id)}</div>`).join('')}`:''}`;
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{studioTeam=b.dataset.st;vStudio()});
 document.querySelectorAll('[data-nmsave]').forEach(b=>b.onclick=()=>{const id=b.dataset.nmsave;renameHero(id,document.querySelector(`[data-nm="${id}"]`).value)});
 document.querySelectorAll('[data-nm]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')renameHero(i.dataset.nm,i.value)});
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>pickArt(b.dataset.up));
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete ART[b.dataset.rm];saveArt();shArt(b.dataset.rm,null);vStudio()});
 $('#bkC').onclick=async()=>{if(!n)return toast('No headshots to back up yet.');try{await navigator.clipboard.writeText(JSON.stringify(ART));toast('Backup copied — paste it somewhere safe.')}catch(e){backup(false)}};
 $('#bkR').onclick=()=>backup(true);$('#stLock').onclick=lockStudio;adminWire();annWire();$('#dlGame').onclick=downloadGame}
function backup(restore){const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div class="mbox" style="max-width:640px"><h3>${restore?'Restore headshots':'Headshot backup'}</h3><p class="sub">${restore?'Paste a backup you copied earlier.':'Copy all of this text and keep it somewhere safe.'}</p>
 <textarea id="bkT">${restore?'':esc(JSON.stringify(ART))}</textarea><div class="row" style="margin-top:12px">${restore?'<button class="btn" id="bkGo">Restore</button>':''}<button class="btn ghost" id="bkX">Close</button></div></div>`;
 document.body.appendChild(m);m.querySelector('#bkX').onclick=()=>m.remove();
 if(restore)m.querySelector('#bkGo').onclick=()=>{try{const d=JSON.parse(m.querySelector('#bkT').value);let c=0;for(const k in d)if(HB[k]&&typeof d[k]==='string'&&d[k].startsWith('data:image/')){ART[k]=d[k];c++}if(saveArt()){m.remove();toast('Restored '+c+' headshots');render()}}catch(e){toast("That backup text isn't valid.")}}}
document.addEventListener('dragover',e=>{const r=e.target.closest('[data-drop]');if(r){e.preventDefault();r.classList.add('drag')}});
document.addEventListener('dragleave',e=>{const r=e.target.closest('[data-drop]');if(r)r.classList.remove('drag')});
document.addEventListener('drop',e=>{const r=e.target.closest('[data-drop]');if(!r)return;e.preventDefault();r.classList.remove('drag');loadArt(r.dataset.drop,e.dataTransfer.files[0])});

/* ================= UPGRADE + TRADE-UP ================= */
function fodderFor(c){return S.cards.filter(x=>x.u!==c.u&&x.id===c.id&&x.par==='base'&&!x.hit&&!x.grade&&(x.lv||1)===1&&!S.pins.includes(x.u)).sort((a,b)=>a.u-b.u)}
function spares(tier){const g={};S.cards.forEach(c=>{if(!HSET.has(c.id)||HB[c.id].tier!==tier)return;(g[c.id]=g[c.id]||[]).push(c)});const out=[];
 for(const id in g){const all=g[id],plain=all.filter(c=>c.par==='base'&&!c.hit&&!c.grade&&(c.lv||1)===1&&!S.pins.includes(c.u)).sort((a,b)=>b.u-a.u);const keep=all.length>plain.length?0:1;out.push(...plain.slice(0,Math.max(0,plain.length-keep)))}return out}
function tradeUp(i){const r=TRADES[i],sp=spares(r.from);if(sp.length<r.n)return;sp.slice(0,r.n).forEach(c=>removeCard(c.u));
 const c=gen({w:{[r.to]:1},duo:0});track('trade');unlock('trade');save();hud();ripFlow([c],{name:'Trade-Up',sub:TN[r.to].toUpperCase(),p1:'#0d9488',p2:'#042f2e'},()=>render())}
function vUpg(){const list=S.cards.filter(c=>(c.lv||1)<5&&fodderFor(c).length).sort((a,b)=>value(b)-value(a));
 const seen=new Set(),rows=list.filter(c=>{if(seen.has(c.id))return false;seen.add(c.id);return true});
 $('#view').innerHTML=`<h2>Upgrade</h2>
 <div class="panel" style="margin-bottom:18px"><h3>🔁 Trade-Up Machine</h3><p class="sub" style="margin:2px 0 12px">Turn spare plain cards into a higher-rarity card. You always keep at least one copy of every hero.</p>
 <div class="trades">${TRADES.map((r,i)=>{const n=spares(r.from).length;return `<div class="trade"><b>${r.n} ${TN[r.from]}</b><span>➜</span><b>1 ${TN[r.to]}</b><small>${n} spare ${TN[r.from]} card${n===1?'':'s'}</small><button class="btn sm" data-trade="${i}" ${n<r.n?'disabled':''}>Trade up</button></div>`}).join('')}</div></div>
 <h3 style="margin-bottom:6px">⏫ Level Up</h3><p class="sub">Level a card up to LV 5 by feeding it a plain duplicate of the same hero plus coins. Every level adds +10% power and +25% value.</p>
 ${rows.length?rows.map(c=>{const h=HB[c.id],lv=c.lv||1,f=fodderFor(c).length;return `<div class="uprow"><div class="cw">${cardHTML(c,'button',`data-det="${c.u}"`)}</div>
  <div><h3 style="font-size:24px">${esc(h.n)}</h3><div class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</div><p class="sub" style="margin:0;font-size:13px">LV ${lv} → ${lv+1} · ${f} spare cop${f===1?'y':'ies'} · value 🪙 ${value(c).toLocaleString()}</p></div>
  <button class="btn" data-upg="${c.u}" ${S.coins<UPC[h.tier]*lv?'disabled':''}>Upgrade · 🪙 ${(UPC[h.tier]*lv).toLocaleString()}</button></div>`}).join(''):`<div class="panel" style="color:var(--dim)">No cards can be levelled up yet. You need a plain duplicate of a hero. Open more packs!</div>`}`;
 document.querySelectorAll('[data-upg]').forEach(b=>b.onclick=()=>doUpgrade(+b.dataset.upg));
 document.querySelectorAll('[data-trade]').forEach(b=>b.onclick=()=>tradeUp(+b.dataset.trade))}
function upgradeDialog(u){const c=byU(u);if(!c)return;const h=HB[c.id],lv=c.lv||1,f=fodderFor(c);
 if(lv>=5)return toast('Already max level');
 if(!f.length)return toast(`You need a plain duplicate of ${h.n} to upgrade.`);
 const cost=UPC[h.tier]*lv;if(S.coins<cost)return toast(`Upgrading costs ${cost} coins.`);
 doUpgrade(u)}
function doUpgrade(u){const c=byU(u);if(!c)return;const h=HB[c.id],lv=c.lv||1,f=fodderFor(c),cost=UPC[h.tier]*lv;
 if(lv>=5||!f.length||S.coins<cost)return;S.coins-=cost;removeCard(f[0].u);c.lv=lv+1;if(c.lv>=5)unlock('lv5');track('up');sfx('up');save();
 const w=document.createElement('div');w.className='greveal g10';
 w.innerHTML=`<div class="gr-rays"></div><div class="gr-slab">${cardHTML(c)}</div><div class="gr-txt"><b>LV ${c.lv}</b><span>UPGRADED</span><p class="sub" style="margin:6px auto">Power ${power(c).atk} · value 🪙 ${value(c).toLocaleString()} · tap to continue</p></div>`;
 document.body.appendChild(w);w.onclick=()=>{w.remove();render()}}

/* ================= INFINITY ================= */
function vInf(){const n=stoneCount();
 $('#view').innerHTML=`<h2>Infinity Vault</h2><p class="sub">Six Infinity Stone cards exist, and each is a 1 of 1: once you pull a stone, it's yours forever and can't be pulled again. They're hidden in packs at tiny odds (better in Cosmic Packs and during Cosmic Storm weekends). Every stone gives your heroes +5% power in missions. Collect all six to unlock the <b>SNAP</b> in missions and claim the <b>1/1 Titan King</b> card.</p>
 <div class="vault"><div class="ring">${STONES.map(([k,nm,col],i)=>{const a=-90+i*60,x=50+38*Math.cos(a*Math.PI/180),y=50+38*Math.sin(a*Math.PI/180),lx=50+52*Math.cos(a*Math.PI/180),ly=50+52*Math.sin(a*Math.PI/180);
  return `<div class="sock ${S.stones[k]?'on':''}" style="left:${x}%;top:${y}%;--sc:${col}"></div><div class="lbl" style="left:${lx}%;top:${ly}%">${nm.toUpperCase()}</div>`}).join('')}
  <div class="core">${n}/6<br><small style="font-size:.5em;color:#fff">STONES</small></div></div></div>
 <h3 style="margin:22px 0 10px">Your Infinity Cards</h3>
 <div class="grid sm">${STONES.map(([k])=>S.stones[k]?`<div class="cw">${stoneHTML(k)}</div>`:`<div class="cw"><div class="mc back" style="filter:grayscale(1) brightness(.4)"></div></div>`).join('')}</div>
 <p class="sub" style="margin-top:14px">Mission bonus right now: +${n*5}% power${n>=6?' · SNAP unlocked':''}</p>
 <h3 style="margin:22px 0 10px">The Infinity Reward</h3>
 <div class="row" style="align-items:flex-start;gap:18px"><div style="width:180px">${(()=>{const th=S.cards.find(c=>c.id==='thanos');return th?cardHTML(th,'button',`data-det="${th.u}"`):`<div class="mc back" style="filter:grayscale(1) brightness(.35)"></div>`})()}</div>
 <p class="sub" style="max-width:46ch">${S.thanosGiven?'You claimed the one and only <b>Titan King 1/1</b>. He can join your mission squad and can never be sold.':`Collect all six Infinity Stones to claim the one and only <b>Titan King 1/1</b> card. ${6-n} stone${6-n===1?'':'s'} to go.`}</p></div>`}

/* ================= TROPHIES ================= */
function vTroph(){const n=ACH.filter(a=>S.ach[a[0]]).length;
 $('#view').innerHTML=`<h2>Trophies</h2><p class="sub">${n} of ${ACH.length} unlocked. Each trophy pays coins the moment you earn it.</p>
 <div class="achgrid">${ACH.map(([k,t,d,ic,rw])=>`<div class="ach ${S.ach[k]?'on':''}"><div class="ic">${ic}</div><div><b>${t}</b><span>${d}</span><br><em>${S.ach[k]?'✓ Earned':'+'+rw.toLocaleString()+' coins'}</em></div></div>`).join('')}</div>
 <div class="row" style="margin-top:30px"><button class="btn ghost sm" id="reset">Reset my save</button></div>`;
 let armed=false;$('#reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='Tap again to erase all progress';e.target.className='btn red sm';return}S=fresh();save();render();toast('Save reset')}}

if(stoneCount()>=6&&!S.thanosGiven){S.thanosGiven=1;claim('thanos');S.cards.push({u:S.uid++,id:'thanos',par:'base',ser:1,hit:null,grade:0,lv:1});save();setTimeout(()=>toast('♾️ All six stones! The 1/1 Titan King card is in your collection.'),600)}
document.getElementById('snd').onclick=()=>{S.mute=!S.mute;save();hud();if(!S.mute)sfx('coin')};
loginBonus();render();
if(!S.tut)setTimeout(()=>tutorial(),500);else setTimeout(()=>annPop(),900);
netInit();

/* card tilt + shine */
(()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let cur=null,raf=0,ev=null;
 const reset=c=>{c.classList.remove('tilting');c.style.removeProperty('--rx');c.style.removeProperty('--ry')};
 const upd=()=>{raf=0;if(!ev)return;const c=ev.target.closest&&ev.target.closest('.mc');if(cur&&cur!==c)reset(cur);cur=c;if(!c||c.classList.contains('dim'))return;
  const r=c.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;if(x<0||x>1||y<0||y>1)return reset(c);
  c.classList.add('tilting');c.style.setProperty('--ry',((x-.5)*16).toFixed(2)+'deg');c.style.setProperty('--rx',((.5-y)*16).toFixed(2)+'deg');
  c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%');c.style.setProperty('--hx',x.toFixed(3))};
 document.addEventListener('pointermove',e=>{ev=e;if(!raf)raf=requestAnimationFrame(upd)},{passive:true});
 document.addEventListener('pointerleave',()=>{if(cur)reset(cur);cur=null},true);
 document.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'&&cur){reset(cur);cur=null}},{passive:true})})();
</script>
</body>
